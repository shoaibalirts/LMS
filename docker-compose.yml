services:

  # ─────────────────────────────────────────────────────────────────
  # 1. Database — stateful, pinned to manager, replicas: 1
  # ─────────────────────────────────────────────────────────────────
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    # container_name removed — Swarm manages naming automatically
    environment:
      - ACCEPT_EULA=Y
      - SA_PASSWORD=ShoaibLovesHerMother-@Fkrs1234
    ports:
      - "1433:1433"
    volumes:
      - sql_data:/var/opt/mssql
    deploy:
      replicas: 1                         # DB must never have >1 replica (shared volume)
      placement:
        constraints:
          - node.role == manager          # Pin to manager so volume is always accessible
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
      update_config:
        parallelism: 1
        delay: 30s                        # Give SQL Server time to recover before next update

  # ─────────────────────────────────────────────────────────────────
  # 2. Backend API — stateless, scalable, 3 replicas
  # ─────────────────────────────────────────────────────────────────
  api:
    image: shoaibali808/csharp-lms-webapi:latest
    # build: removed — Swarm pulls from registry; build locally first
    ports:
      - "8080:8080"                       # Routing Mesh: all nodes expose 8080
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Server=db;Database=LMS;User Id=sa;Password=ShoaibLovesHerMother-@Fkrs1234;TrustServerCertificate=True;
      - Logging__Console__FormatterName=json
    deploy:
      replicas: 3                         # 3 API instances spread across workers
      update_config:
        parallelism: 1                    # Replace 1 replica at a time
        delay: 10s                        # Wait 10s between each replacement
        failure_action: rollback          # Auto-rollback if new container fails health check
        order: start-first                # Start new replica before stopping old (zero downtime)
      rollback_config:
        parallelism: 1
        delay: 5s
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 5
    # depends_on is ignored by Swarm — the restart_policy handles DB not being ready yet

  # ─────────────────────────────────────────────────────────────────
  # 3. Frontend — stateless, 2 replicas
  # ─────────────────────────────────────────────────────────────────
  web:
    image: shoaibali808/vue-lms-frontend:latest
    # build: removed — Swarm pulls from registry
    ports:
      - "80:80"                           # Routing Mesh: all nodes expose port 80
    deploy:
      replicas: 2
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3

  # ─────────────────────────────────────────────────────────────────
  # 4. Prometheus — stateful, pinned to manager
  # ─────────────────────────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager          # Config file and volume are on manager node
      restart_policy:
        condition: on-failure

  # ─────────────────────────────────────────────────────────────────
  # 5. Grafana — stateful, pinned to manager
  # ─────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ─────────────────────────────────────────────────────────────────
  # 6. Node Exporter — must run on EVERY node (global mode)
  # ─────────────────────────────────────────────────────────────────
  node-exporter:
    image: prom/node-exporter:latest
    ports:
      - "9100:9100"
    deploy:
      mode: global                        # One instance per node automatically — no replicas count needed
      restart_policy:
        condition: on-failure

  # ─────────────────────────────────────────────────────────────────
  # 7. Loki — stateful, pinned to manager
  # ─────────────────────────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  # ─────────────────────────────────────────────────────────────────
  # 8. Promtail — must run on EVERY node to collect all container logs
  # ─────────────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ./promtail-config.yml:/etc/promtail/config.yml
    deploy:
      mode: global                        # One per node — collects logs from that node's containers
      restart_policy:
        condition: on-failure

volumes:
  sql_data:
  prometheus_data:
  loki_data:
  grafana_data: