# WORKFLOW: Den øverste enhed — definerer hvornår og hvad der køres automatisk.
# CI/CD: CI bygger og tester koden ved hvert push. CD deployer den bagefter.
name: CI

# Triggere: hvornår workflowet startes
on:
  push:
    branches: [main, master]
  pull_request:

# JOBS: Kører parallelt, hver i sit eget isolerede miljø (virtuel maskine)
jobs:

  # JOB 1: .NET backend
  dotnet-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    # STEPS: Kører sekventielt inde i jobbet — fejler ét step, stopper resten
    steps:
      - name: Checkout code
        uses: actions/checkout@v4        # "uses" = færdiglavet action fra Marketplace - cloner vores repo ind i den virtuelle maskine som skal bygge og teste koden

      - name: Set up .NET
        uses: actions/setup-dotnet@v4 # "uses" = færdiglavet action fra Marketplace - installerer .NET SDK i den virtuelle maskine
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore LMS.sln      # "run" = almindelig shell-kommando

      - name: Build
        run: dotnet build LMS.sln --no-restore --configuration Release

      - name: Test                       # Kører LMS_API_UnitTest + LMS_API_BDDTest
        run: dotnet test LMS.sln --no-build --configuration Release --verbosity normal

  # JOB 2: Vue frontend
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lms_frontend/package-lock.json
  
      - name: Install dependencies
        run: npm ci
        working-directory: lms_frontend

      - name: Build
        run: npm run build
        working-directory: lms_frontend

  # JOB 3: DAST — ZAP scans the running API for security vulnerabilities
  zap-dast:
    name: DAST (ZAP API Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Start API with Docker Compose
        run: docker compose up -d db api

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/openapi/v1.json > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "API did not start in time" && exit 1

      - name: Stop existing containers before DAST
        run: docker compose down

      - name: Run ZAP scan
        uses: zaproxy/action-full-scan@v0.10.0
        with:
          target: 'http://localhost:8080'


      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          target: 'http://localhost:8080/openapi/v1.json'
          format: openapi
          fail_action: false
          allow_issue_writing: false
      - name: Tear down             # ← clean up AFTER ZAP is done
        run: docker compose down
          # NEW JOB 4: CD Deployment
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    # This prevents deployment if any of the three test jobs fail:
    needs: [dotnet-test, build-and-test, zap-dast] 
    # Only deploy on direct merges/pushes to main or master, not on PR test runs:
    if: github.event_name == 'push' 
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deployment script
        run: |
          echo "Deploying the frontend and backend..."
          # Add your server deployment or cloud upload commands here