# WORKFLOW: Den øverste enhed — definerer hvornår og hvad der køres automatisk.
# CI/CD: CI bygger og tester koden ved hvert push. CD deployer den bagefter.
name: CI

# Triggere: hvornår workflowet startes
on:
  push:
    branches: [main, master]
  pull_request:

# JOBS: Kører parallelt, hver i sit eget isolerede miljø (virtuel maskine)
jobs:

  # JOB 1: .NET backend
  dotnet-test:
    name: .NET Build & Test
    runs-on: ubuntu-latest

    # STEPS: Kører sekventielt inde i jobbet — fejler ét step, stopper resten
    steps:
      - name: Checkout code
        uses: actions/checkout@v4        # "uses" = færdiglavet action fra Marketplace - cloner vores repo ind i den virtuelle maskine som skal bygge og teste koden

      - name: Set up .NET
        uses: actions/setup-dotnet@v4   # "uses" = færdiglavet action fra Marketplace - installerer .NET SDK i den virtuelle maskine
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore LMS.sln      # "run" = almindelig shell-kommando

      - name: Build
        run: dotnet build LMS.sln --no-restore --configuration Release

      - name: Test                       # Kører LMS_API_UnitTest + LMS_API_BDDTest
        run: dotnet test LMS.sln --no-build --configuration Release --verbosity normal

  # JOB 2: Vue frontend
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: lms_frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: lms_frontend

      - name: Build
        run: npm run build
        working-directory: lms_frontend

  # JOB 3: DAST — ZAP scans the running API for security vulnerabilities
  zap-dast:
    name: DAST (ZAP API Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # FIX 1: Start only db and api, and capture the network name Docker Compose creates.
      # The network is always named "<folder>_default" — on GitHub Actions the workspace
      # folder is the repo name, so we read it dynamically instead of hardcoding it.
      - name: Start API with Docker Compose
        run: |
          docker compose up -d db api
          # Capture the network so ZAP can join it in the next step
          NETWORK=$(docker network ls --format '{{.Name}}' | grep '_default' | head -1)
          echo "COMPOSE_NETWORK=$NETWORK" >> $GITHUB_ENV

      - name: Wait for API to be ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/openapi/v1.json > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            echo "Waiting... ($i/30)"
            sleep 5
          done
          echo "API did not start in time" && exit 1

      # FIX 2: Tell ZAP to join the Compose network and reach the api container
      # by its service name ("api") instead of localhost.
      # This way ZAP never tries to bind port 8080 on the host — no conflict.
      - name: ZAP API Scan
        uses: zaproxy/action-api-scan@v0.9.0
        with:
          # Use the Docker service name "api" — ZAP is on the same network
          target: 'http://api:8080/openapi/v1.json'
          format: openapi
          fail_action: false
          allow_issue_writing: false
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          network: ${{ env.COMPOSE_NETWORK }}       # ZAP joins the Compose network

      # FIX 3: Always tear down — even if ZAP fails — so no containers linger
      - name: Tear down containers
        if: always()                                # runs even if a previous step failed
        run: docker compose down --remove-orphans

  # JOB 4: CD Deployment
  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    # This prevents deployment if any of the three test jobs fail:
    needs: [dotnet-test, build-and-test, zap-dast]
    # Only deploy on direct merges/pushes to main or master, not on PR test runs:
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run deployment script
        run: |
          echo "Deploying the frontend and backend..."
          # Add your server deployment or cloud upload commands here